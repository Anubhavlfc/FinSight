[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finsight"
version = "0.1.0"
description = "Financial Analysis Copilot: evidence-backed three-year analysis of SEC filers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3",
    "pandas>=2.1",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
finsight = "finsight.cli:main"

[tool.setuptools.packages.find]
include = ["finsight*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: real network calls to SEC EDGAR (opt-in: FINSIGHT_RUN_LIVE=1)",
]
addopts = "-ra"
