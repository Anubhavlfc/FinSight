# Research report (PDF) settings: valuation assumptions and the rating rule.
# Every value here is printed in the report's assumptions table. Change them here, or per run with
# `finsight research-pdf --discount-rate ... --terminal-growth ...`.

[valuation]
forecast_years = 10
# Base-year free cash flow: "average_margin" = latest revenue x the average FCF margin over the analysed
# years (smooths one-year capex swings); "latest" = the latest year's FCF as reported.
base_fcf_method = "average_margin"
# Discount rate = risk-free rate + beta x equity risk premium (CAPM). Beta and the premium are analyst
# assumptions, not estimates; the risk-free rate is a dated market input with its source.
equity_risk_premium_pct = 5.0
beta = 1.0
terminal_growth_pct = 3.0
# Year-1 FCF growth = the company's revenue CAGR over the analysed window, kept within these bounds,
# then fading in a straight line to the terminal growth rate by the last forecast year.
stage1_growth_floor_pct = 0.0
stage1_growth_cap_pct = 15.0

[valuation.risk_free]
value_pct = 4.88
as_of = 2026-11-10
source = "US 10-year Treasury note yield (Trading Economics market report)"
source_url = "https://tradingeconomics.com/united-states/government-bond-yield/news/599802"

[recommendation]
# Rating from the upside of the target price over the current price.
buy_at_or_above_pct = 10.0
sell_at_or_below_pct = -10.0
