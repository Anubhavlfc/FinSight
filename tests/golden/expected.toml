# Figures typed by hand from the audited financial statements in each company's 10-K
# (USD millions, as printed). They are NOT produced by FinSight: the golden tests run
# the pipeline on the recorded XBRL in fixtures/golden/ and compare its output with
# these numbers and with metrics worked out from them in the test.
#
# Income statement and cash flow figures come from the latest 10-K in the window, which
# presents all three years. Balance sheet figures for the two latest years come from that
# same 10-K; the earliest year comes from the prior 10-K. "debt" lists the balance-sheet
# lines that make up interest-bearing debt, as printed.
#
# Cutoff 2026-11-01 for every company. Apple's FY2026 10-K was filed on 2026-11-03, after the
# cutoff, so its window is FY2023-FY2025.

[MSFT]
cik = "0000789019"
periods = ["FY2024", "FY2025", "FY2026"]
statements = "10-K 0001193125-26-323660 (FY2026; income statement, cash flows, balance sheet 2026/2025); 10-K 0000950170-25-100235 (balance sheet 2024)"
revenue             = [245_122, 281_724, 331_839]   # Total revenue
gross_profit        = [171_008, 193_893, 225_465]   # Gross margin
operating_income    = [109_433, 128_528, 155_237]
net_income          = [88_136, 101_832, 133_749]
operating_cash_flow = [118_548, 136_162, 182_935]   # Net cash from operations
capital_expenditure = [44_477, 64_551, 115_948]     # Additions to property and equipment
cash_and_equivalents = [18_315, 30_242, 20_935]
current_assets      = [159_734, 191_131, 207_710]
current_liabilities = [125_286, 141_218, 168_825]
# Short-term debt + current portion of long-term debt + long-term debt
debt = [[6_693, 2_249, 42_688], [0, 2_999, 40_152], [9_227, 31_067]]

