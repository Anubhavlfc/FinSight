name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: Python tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Offline demo
        run: finsight --db /tmp/ci.sqlite3 --out /tmp/out analyze DEMO --offline --cutoff 2026-11-01

  web:
    name: Frontend build and API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -e ".[dev]"
      - name: OpenAPI file matches the Python models
        run: python scripts/export_openapi.py --check
      - run: npm ci
        working-directory: web
      - name: TypeScript types match the OpenAPI file
        working-directory: web
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts
      - run: npm run build
        working-directory: web

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -e ".[dev]"
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      # Offline: the server runs the synthetic fixture company, so no SEC access or API key is used.
      - run: npx playwright test --trace off
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  docker:
    name: Container image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t finsight:ci .
      - name: Container answers its health check and serves the app
        run: |
          docker run -d --name finsight -p 8000:8000 finsight:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/health && break || sleep 1; done
          curl -fsS http://127.0.0.1:8000/api/health | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:8000/app/reports | grep -q 'FinSight AI'
          docker logs finsight
