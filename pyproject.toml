[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finsight"
version = "0.3.0"
description = "Financial Analysis Copilot: evidence-backed three-year analysis of SEC filers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3",
    "pandas>=2.1",
    "requests>=2.31,<3",
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "matplotlib>=3.8",
    "anthropic>=1.0",
    "reportlab>=4.2",
]

[project.optional-dependencies]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
dashboard = ["streamlit>=1.50"]
dev = ["pytest>=8", "pypdf>=4", "httpx>=0.27,<1", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "streamlit>=1.50"]

[project.scripts]
finsight = "finsight.cli:main"
finsight-api = "finsight.api.app:main"
finsight-dashboard = "finsight.dashboard.launch:main"

[tool.setuptools.packages.find]
include = ["finsight*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: real network calls to SEC EDGAR (opt-in: FINSIGHT_RUN_LIVE=1)",
    "llm: real Anthropic API calls (opt-in: FINSIGHT_RUN_LLM=1 and ANTHROPIC_API_KEY; costs money)",
]
addopts = "-ra"
